name: servana

# Local development stack (Plan §26.1). All credentials below are NON-SECRET
# local dev defaults — never reused in staging/production. Container env vars
# override .env (Laravel/dotenv does not clobber real environment variables),
# so the app reaches services by their compose hostnames.

x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8080
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: servana
  DB_USERNAME: servana
  DB_PASSWORD: secret
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: masterKey
  FILESYSTEM_DISK: local
  AWS_ACCESS_KEY_ID: servana
  AWS_SECRET_ACCESS_KEY: servana_secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: servana
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

x-app-build: &app-build
  context: .
  dockerfile: docker/php.Dockerfile
  target: dev

services:
  app:
    build: *app-build
    image: servana-app:dev
    environment: *app-environment
    volumes:
      - .:/var/www/html
      - servana-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servana
      POSTGRES_USER: servana
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - servana-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servana -d servana"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - servana-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - servana-meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: servana
      MINIO_ROOT_PASSWORD: servana_secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - servana-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # One-shot: waits for MinIO and creates the bucket. Exits 0 when done.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 servana servana_secret &&
      mc mb --ignore-existing local/servana &&
      echo 'bucket servana ready';
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: "500"
    restart: unless-stopped

  # ClamAV is memory-heavy; opt in with `--profile clamav` (Plan §27 Phase 2
  # risk note). Real upload scanning is wired in Phase 23.
  clamav:
    image: clamav/clamav:latest
    profiles: ["clamav"]
    ports:
      - "3310:3310"
    volumes:
      - servana-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Queue worker placeholder. Replaced by Laravel Horizon in Phase 21.
  worker:
    build: *app-build
    image: servana-app:dev
    command: ["php", "artisan", "queue:work", "--tries=1", "--sleep=1", "--max-time=3600"]
    environment: *app-environment
    volumes:
      - .:/var/www/html
      - servana-vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Scheduler placeholder. Real scheduled tasks land from Phase 20 onward.
  scheduler:
    build: *app-build
    image: servana-app:dev
    command: ["php", "artisan", "schedule:work"]
    environment: *app-environment
    volumes:
      - .:/var/www/html
      - servana-vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # One-off SPA build/dev helper (Node 20). Not started by `make up`; invoked by
  # `make build` / `make npm`. Builds into the bind-mounted public/spa.
  spa-builder:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      - servana-node-modules:/app/node_modules

volumes:
  servana-vendor:
  servana-node-modules:
  servana-pgdata:
  servana-redis:
  servana-meili:
  servana-minio:
  servana-clamav:
