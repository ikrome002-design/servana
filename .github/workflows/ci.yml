name: CI

# PR-stage pipeline (Plan §26.2 "on PR" line) + a Docker image-build job
# (Phase 2). The "on main" build/push/deploy stages are added in Phase 25.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Pint, Larastan, Pest
    runs-on: ubuntu-latest
    services:
      # Tests run against PostgreSQL, never SQLite (CLAUDE.md §6.13).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: servana_test
          POSTGRES_USER: servana
          POSTGRES_PASSWORD: servana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servana"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Phase 22 search substrate. The suite runs on Scout's NullEngine by default
      # (phpunit.xml forces SCOUT_DRIVER=null), so this service exists purely so the
      # Phase 22 engine-integration tests prove real Meilisearch behaviour in CI
      # rather than only on a developer machine. They fail — never skip — without it.
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ciMasterKey
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
        options: >-
          --health-cmd "echo PING | nc 127.0.0.1 3310 | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 120s

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          # Pinned stack (Plan AS-1). Local dev may run a newer 8.x; CI is the
          # source of truth for the pinned runtime.
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, gd, bcmath, pcntl, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify ClamAV daemon is reachable
        shell: bash
        run: |
          for attempt in {1..60}; do
            if php -r '
              $socket = @stream_socket_client(
                  "tcp://127.0.0.1:3310",
                  $errorNumber,
                  $errorMessage,
                  2
              );

              if ($socket === false) {
                  exit(1);
              }

              stream_set_timeout($socket, 2);
              fwrite($socket, "zPING\0");
              $response = stream_get_contents($socket);
              fclose($socket);

              exit(rtrim($response, "\0\r\n") === "PONG" ? 0 : 1);
            '; then
              echo "clamd is reachable on 127.0.0.1:3310."
              exit 0
            fi

            echo "Waiting for clamd readiness: attempt ${attempt}/60"
            sleep 5
          done

          echo "::error::clamd did not become reachable on 127.0.0.1:3310."
          exit 1

      - name: Tests — genuine ClamAV EICAR integration
        env:
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
          CLAMAV_CONNECT_TIMEOUT: 3
          CLAMAV_READ_TIMEOUT: 30
        run: php vendor/bin/pest tests/Feature/Files/ClamAvEicarIntegrationTest.php --fail-on-skipped


      - name: Verify Meilisearch is reachable (Phase 22)
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:7700/health > /dev/null; then
              echo "Meilisearch is reachable on 127.0.0.1:7700."
              exit 0
            fi

            echo "Waiting for Meilisearch readiness: attempt ${attempt}/30"
            sleep 2
          done

          echo "::error::Meilisearch did not become reachable on 127.0.0.1:7700."
          exit 1

      - name: Lint — Pint (check only)
        run: composer pint -- --test

      - name: Static analysis — Larastan level 8
        run: composer stan

      # Phase 23 / REM-TRACE-001 (Plan §85): fail FAST and with a named step when the
      # requirement-traceability contract drifts — stale statuses, prose in `status`, a
      # requirement claiming a suite that does not exist, an untruthful external-gate row, or a
      # claimed endpoint/screen that is not in the live inventory. These suites also run inside
      # the parallel suite below; this step exists so the failure is unambiguous in CI.
      - name: Contract — requirement traceability (Plan §85)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: servana_test
          DB_USERNAME: servana
          DB_PASSWORD: servana
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test tests/Feature/Traceability --fail-on-skipped

      # Phase 24 (Plan §72). Deterministic performance invariants ONLY: SQL query-count/N+1
      # budgets, cache-scope declarations and OPcache/preload configuration. No wall-clock
      # threshold runs here — ApiLatencyBenchmarkTest is skipped unless SERVANA_RUN_BENCHMARK=1,
      # so shared-runner timing variance can never make this job flaky. `--fail-on-skipped` is
      # deliberately NOT used for the same reason.
      - name: Contract — performance guards (Plan §72; N+1, cache scope, OPcache preload)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: servana_test
          DB_USERNAME: servana
          DB_PASSWORD: servana
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test tests/Feature/Performance

      # Phase UI-02 CI remediation: the Backend shell feature tests execute the
      # production manifest contract, so this isolated job must create the real
      # Vite manifest before it starts the parallel PHP suite.
      - name: Set up Node 20 for Backend SPA shell contracts
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies for Backend SPA shell contracts
        run: npm ci

      - name: Build SPA for Backend shell contracts
        run: npm run build

      - name: Tests — Pest on PostgreSQL (parallel)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: servana_test
          DB_USERNAME: servana
          DB_PASSWORD: servana
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
          CLAMAV_CONNECT_TIMEOUT: 3
          CLAMAV_READ_TIMEOUT: 30
          # Phase 22: the suite defaults to Scout's NullEngine; only the engine
          # tests opt in, and they resolve the host/key from here.
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_KEY: ciMasterKey
        run: php artisan test --parallel
      - name: Dependency audit (Composer)
        run: composer audit --no-interaction

  frontend:
    name: Frontend — ESLint, vue-tsc, Vitest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint — ESLint (no jQuery, no device detection)
        run: npm run lint

      - name: Type-check — vue-tsc
        run: npm run typecheck

      - name: API contract check — OpenAPI ⇄ generated TypeScript parity (Phase 10)
        run: npm run api:contract:check

      # Phase 23 / REM-TRACE-001: the screen-inventory + §27.1 specification contract
      # (orphan specs, planned screens owned by a verified-complete phase, registered release
      # gaps, route-less entries). Runs again inside the full Vitest suite below; this step
      # names the failure explicitly.
      - name: Contract — screen inventory and §27.1 specifications
        run: npx vitest run src/screens/screenInventory.spec.ts

      # Phase UI-02: the account-host registry has one authority
      # (config/account-hosts.json) and two generated consumers. Fail the build when
      # either has drifted rather than discovering it at deploy time.
      - name: Contract — account-host registry is current (Phase UI-02)
        run: node scripts/generate-account-hosts.mjs --check

      # Phase UI-04: the design-token authority (resources/spa/src/design-system/tokens.json) has
      # two generated consumers plus a computed contrast contract. The PHP suite proves the source
      # hash matches; this step additionally proves the generator is deterministic and that no
      # generated BODY was hand-edited. The PHP image carries no Node runtime, so this is the only
      # place that check can run.
      - name: Contract — design tokens are current (Phase UI-04)
        run: node scripts/generate-design-tokens.mjs --check

      - name: Unit tests — Vitest
        run: npm run test

      - name: Build SPA — Vite
        run: npm run build

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Proves both Dockerfiles build. No push, no secrets, no deploy (Phase 25).
      - name: Build app image (dev target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php.Dockerfile
          target: dev
          push: false
          tags: servana-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image (prod target, incl. SPA build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx.Dockerfile
          target: prod
          push: false
          # `load` so the image is available to the local daemon for the host smoke below.
          load: true
          tags: servana-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------------
      # Phase UI-02 — account-host smoke against the BUILT production image.
      #
      # UI-01 found the deployed root serving Laravel's scaffold and the SPA chunks
      # 404ing, while every existing browser test passed against a Vite preview
      # origin. This step probes the real Nginx image so that class of defect cannot
      # ship again. It is NOT the release-wide browser gate — UI01-PROV-003 stays
      # open and is owned by UI-16.
      # ---------------------------------------------------------------------------
      # The PROD php target is used deliberately: it is self-contained (`COPY . /var/www/html`),
      # whereas the dev target expects a bind-mounted source and would serve nothing here.
      - name: Build app image (prod target) for the host smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php.Dockerfile
          target: prod
          push: false
          load: true
          tags: servana-app:ci-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start the built images
        run: |
          docker network create servana-ci
          # The upstream MUST be named `app` — docker/nginx/default.conf does `fastcgi_pass app:9000`.
          # Session/cache are forced to array so the smoke needs no database or Redis; the SPA
          # shell route touches neither.
          docker run -d --name app --network servana-ci \
            -e SESSION_DRIVER=array -e CACHE_STORE=array -e QUEUE_CONNECTION=sync \
            servana-app:ci-prod
          docker run -d --name edge --network servana-ci -p 8080:8080 servana-nginx:ci
          for i in $(seq 1 40); do
            if curl -fsS -H 'Host: localhost' http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "edge ready"; break
            fi
            sleep 2
          done
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8080/health

      - name: Extract the built SPA manifest for the smoke matrix
        run: |
          mkdir -p public/spa/.vite
          docker cp edge:/var/www/html/public/spa/.vite/manifest.json public/spa/.vite/manifest.json

      - name: Smoke — eight account hosts on the built image (Phase UI-02)
        run: node scripts/ui02-host-smoke.mjs --origin http://127.0.0.1:8080

      - name: Upload host matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-host-matrix
          path: docs/frontend/audits/ui-02/host-matrix.json
          if-no-files-found: warn

      - name: Tear down smoke containers
        if: always()
        run: |
          docker rm -f edge app || true
          docker network rm servana-ci || true

  security:
    name: Security — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    # Authoritative Linux browser gate for Phase 10. The local Windows Playwright
    # run stalled without producing a completed run, so the SPA end-to-end suite
    # MUST be exercised here on Linux. Kept separate from Backend/Frontend/Docker/
    # Security; the SPA is a static preview build, so no Postgres/Redis is needed.
    name: E2E — Playwright
    runs-on: ubuntu-latest
    # Reasonable bound: fails the workflow if the run stalls without completing
    # (the documented Windows-host failure mode) rather than hanging indefinitely.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser + Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Build SPA — Vite (production)
        run: npm run build

      - name: End-to-end tests — Playwright (Chromium)
        # `npm run e2e` exits non-zero on any failed Playwright test, failing the
        # workflow. Existing tests are run unmodified — no skip, no extra retry,
        # no suppression (playwright.config.ts already pins CI retries=1, workers=1).
        run: npm run e2e

      - name: Upload Playwright report + test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
