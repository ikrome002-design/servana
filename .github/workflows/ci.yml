name: CI

# PR-stage pipeline (Plan §26.2 "on PR" line) + a Docker image-build job
# (Phase 2). The "on main" build/push/deploy stages are added in Phase 25.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Pint, Larastan, Pest
    runs-on: ubuntu-latest
    services:
      # Tests run against PostgreSQL, never SQLite (CLAUDE.md §6.13).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: servana_test
          POSTGRES_USER: servana
          POSTGRES_PASSWORD: servana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servana"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Phase 22 search substrate. The suite runs on Scout's NullEngine by default
      # (phpunit.xml forces SCOUT_DRIVER=null), so this service exists purely so the
      # Phase 22 engine-integration tests prove real Meilisearch behaviour in CI
      # rather than only on a developer machine. They fail — never skip — without it.
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ciMasterKey
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
        options: >-
          --health-cmd "echo PING | nc 127.0.0.1 3310 | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 120s

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          # Pinned stack (Plan AS-1). Local dev may run a newer 8.x; CI is the
          # source of truth for the pinned runtime.
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, gd, bcmath, pcntl, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify ClamAV daemon is reachable
        shell: bash
        run: |
          for attempt in {1..60}; do
            if php -r '
              $socket = @stream_socket_client(
                  "tcp://127.0.0.1:3310",
                  $errorNumber,
                  $errorMessage,
                  2
              );

              if ($socket === false) {
                  exit(1);
              }

              stream_set_timeout($socket, 2);
              fwrite($socket, "zPING\0");
              $response = stream_get_contents($socket);
              fclose($socket);

              exit(rtrim($response, "\0\r\n") === "PONG" ? 0 : 1);
            '; then
              echo "clamd is reachable on 127.0.0.1:3310."
              exit 0
            fi

            echo "Waiting for clamd readiness: attempt ${attempt}/60"
            sleep 5
          done

          echo "::error::clamd did not become reachable on 127.0.0.1:3310."
          exit 1

      - name: Tests — genuine ClamAV EICAR integration
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: servana_test
          DB_USERNAME: servana
          DB_PASSWORD: servana
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
          CLAMAV_CONNECT_TIMEOUT: 3
          CLAMAV_READ_TIMEOUT: 30
        run: php vendor/bin/pest tests/Feature/Files/ClamAvEicarIntegrationTest.php --fail-on-skipped


      - name: Verify Meilisearch is reachable (Phase 22)
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:7700/health > /dev/null; then
              echo "Meilisearch is reachable on 127.0.0.1:7700."
              exit 0
            fi

            echo "Waiting for Meilisearch readiness: attempt ${attempt}/30"
            sleep 2
          done

          echo "::error::Meilisearch did not become reachable on 127.0.0.1:7700."
          exit 1

      - name: Lint — Pint (check only)
        run: composer pint -- --test

      - name: Static analysis — Larastan level 8
        run: composer stan

      # Phase 23 / REM-TRACE-001 (Plan §85): fail FAST and with a named step when the
      # requirement-traceability contract drifts — stale statuses, prose in `status`, a
      # requirement claiming a suite that does not exist, an untruthful external-gate row, or a
      # claimed endpoint/screen that is not in the live inventory. These suites also run inside
      # the parallel suite below; this step exists so the failure is unambiguous in CI.
      - name: Contract — requirement traceability (Plan §85)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: servana_test
          DB_USERNAME: servana
          DB_PASSWORD: servana
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test tests/Feature/Traceability --fail-on-skipped

      # Phase 24 (Plan §72). Deterministic performance invariants ONLY: SQL query-count/N+1
      # budgets, cache-scope declarations and OPcache/preload configuration. No wall-clock
      # threshold runs here — ApiLatencyBenchmarkTest is skipped unless SERVANA_RUN_BENCHMARK=1,
      # so shared-runner timing variance can never make this job flaky. `--fail-on-skipped` is
      # deliberately NOT used for the same reason.
      - name: Contract — performance guards (Plan §72; N+1, cache scope, OPcache preload)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: servana_test
          DB_USERNAME: servana
          DB_PASSWORD: servana
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test tests/Feature/Performance

      # Phase UI-02 CI remediation: the Backend shell feature tests execute the
      # production manifest contract, so this isolated job must create the real
      # Vite manifest before it starts the parallel PHP suite.
      - name: Set up Node 20 for Backend SPA shell contracts
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies for Backend SPA shell contracts
        run: npm ci

      - name: Build SPA for Backend shell contracts
        run: npm run build

      # UI-15 CI fallback: retain named, PostgreSQL-backed evidence for the
      # request/worker/two signed-stream boundaries alongside the full suite.
      - name: Security regression — Audit exports and private file access (UI-15)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: servana_test
          DB_USERNAME: servana
          DB_PASSWORD: servana
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: >-
          php vendor/bin/pest tests/Feature/Audit
          tests/Feature/Files/FileDownloadAuthorizationTest.php
          tests/Feature/Files/FileSignedUrlExpiryTest.php
          tests/Feature/Security/Phase23ExportHardeningTest.php
          tests/Feature/Auth/SessionRevocationTest.php
          tests/Feature/Auth/SessionLifecycleTest.php
          tests/Feature/Auth/PermissionMatrixTest.php
          tests/Feature/Auth/PermissionMatrixCatalogueCompletenessTest.php
          tests/Feature/Docs/Ui07NavigationContractTest.php
          --log-junit /tmp/ui15-export-security.xml

      - name: Upload UI-15 export security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui15-export-security
          path: /tmp/ui15-export-security.xml
          if-no-files-found: warn

      - name: Tests — Pest on PostgreSQL (parallel)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: servana_test
          DB_USERNAME: servana
          DB_PASSWORD: servana
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
          CLAMAV_CONNECT_TIMEOUT: 3
          CLAMAV_READ_TIMEOUT: 30
          # Phase 22: the suite defaults to Scout's NullEngine; only the engine
          # tests opt in, and they resolve the host/key from here.
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_KEY: ciMasterKey
        run: php artisan test --parallel

      - name: Dependency audit (Composer)
        run: composer audit --no-interaction

  frontend:
    name: Frontend — ESLint, vue-tsc, Vitest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint — ESLint (no jQuery, no device detection)
        run: npm run lint

      - name: Type-check — vue-tsc
        run: npm run typecheck

      - name: API contract check — OpenAPI ⇄ generated TypeScript parity (Phase 10)
        run: npm run api:contract:check

      # Phase 23 / REM-TRACE-001: the screen-inventory + §27.1 specification contract
      # (orphan specs, planned screens owned by a verified-complete phase, registered release
      # gaps, route-less entries). Runs again inside the full Vitest suite below; this step
      # names the failure explicitly.
      - name: Contract — screen inventory and §27.1 specifications
        run: npx vitest run src/screens/screenInventory.spec.ts

      # Phase UI-02: the account-host registry has one authority
      # (config/account-hosts.json) and two generated consumers. Fail the build when
      # either has drifted rather than discovering it at deploy time.
      - name: Contract — account-host registry is current (Phase UI-02)
        run: node scripts/generate-account-hosts.mjs --check

      # Phase UI-04: the design-token authority (resources/spa/src/design-system/tokens.json) has
      # two generated consumers plus a computed contrast contract. The PHP suite proves the source
      # hash matches; this step additionally proves the generator is deterministic and that no
      # generated BODY was hand-edited. The PHP image carries no Node runtime, so this is the only
      # place that check can run.
      - name: Contract — design tokens are current (Phase UI-04)
        run: node scripts/generate-design-tokens.mjs --check

      # Phase UI-05: the approved role content in docs/** is compiled into generated, committed
      # modules. `--check` regenerates in memory and fails when the committed artifacts no longer
      # match their sources — the staleness gate the UI/UX plan §8.8 requires. It deliberately does
      # NOT write: a build that silently regenerated stale output would hide the very diff a
      # reviewer needs to see.
      - name: Contract — generated role content is current (Phase UI-05)
        run: npm run content:check

      # Phase UI-05: the curated landing-image manifest, its responsive derivatives, the approved
      # logo mapping and the UI01-ASSET-002 quarantine. This check never re-encodes an image; it
      # verifies the committed derivatives still exist, decode and hash as recorded, so the result
      # does not depend on the runner's libvips build.
      - name: Contract — landing images and brand quarantine are current (Phase UI-05)
        run: npm run assets:check

      # Phase UI-05: prove the two generators above still FAIL when an input is broken. A guard that
      # silently stopped running would keep the two checks green forever.
      - name: Contract — UI-05 generator negative controls
        run: node scripts/ui05-negative-controls.mjs

      # Phase UI-06: the nine deterministic public-landing audit artifacts are DERIVED from the
      # composition modules, the account-host registry and the compiled content. `--check` re-derives
      # them in memory and fails when the committed files no longer match, so the artifacts the
      # contract tests assert against cannot drift from the code they describe. The PHP image has no
      # Node runtime, so this is the only place the check can run.
      - name: Contract — UI-06 landing audit artifacts are current (Phase UI-06)
        run: node scripts/generate-ui06-artifacts.mjs --check

      # Phase UI-07: the typed navigation registry, the 160 screen specifications and the contract
      # matrices are all DERIVED from docs/frontend/navigation/servana-user-account-navigation-map.yaml,
      # and the router is read through Vite's SSR transform rather than parsed from source. `--check`
      # re-derives everything in memory and fails on any drift, so the contract the PHP tests assert
      # against cannot diverge from the router it describes.
      - name: Contract — UI-07 navigation and screen contract is current (Phase UI-07)
        run: npm run nav:check

      # And prove those guards still reject the defects they exist to catch.
      - name: Contract — UI-07 contract negative controls
        run: npm run nav:negative-controls

      # Phase UI-17: the edge security policy in docker/nginx/default.conf — the CSP pins the hash of
      # the one inline script (byte-identical in the Laravel shell and the SPA index), grants no
      # 'unsafe-inline'/'unsafe-eval'/wildcard, every server block logs with the credential-free
      # format (UI17-SEC-001), the edge never appends a Referrer-Policy over the application's
      # (UI17-SEC-002), and gzip is confined to static assets. Static, so it fails before any build.
      - name: Contract — UI-17 edge security policy
        run: node scripts/ui17-edge-security-contract.mjs

      - name: Unit tests — Vitest
        run: npm run test

      - name: Build SPA — Vite
        run: npm run build

      # Phase UI-17 (UI/UX plan §6.5, §22.1, §22.4): the reviewed compressed budgets in
      # config/frontend-performance-budget.json, measured on the bytes this build emitted — every
      # route component lazy, no account shell bundling another account's code, the initial request
      # and each account's critical path inside budget, no oversized lazy chunk.
      - name: Budget — UI-17 bundle analysis and compressed budgets
        run: node scripts/ui17-bundle-budget.mjs --out test-results/ui17-bundle-report.json

      # And prove the budget gate and the edge contract still FAIL on the defects they exist to catch.
      - name: Budget — UI-17 negative controls
        run: node scripts/ui17-negative-controls.mjs

      - name: Upload UI-17 bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui17-bundle-report
          path: test-results/ui17-bundle-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Proves both Dockerfiles build. No push, no secrets, no deploy (Phase 25).
      - name: Build app image (dev target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php.Dockerfile
          target: dev
          push: false
          tags: servana-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image (prod target, incl. SPA build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx.Dockerfile
          target: prod
          push: false
          # `load` so the image is available to the local daemon for the host smoke below.
          load: true
          tags: servana-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------------
      # Phase UI-02 — account-host smoke against the BUILT production image.
      #
      # UI-01 found the deployed root serving Laravel's scaffold and the SPA chunks
      # 404ing, while every existing browser test passed against a Vite preview
      # origin. This step probes the real Nginx image so that class of defect cannot
      # ship again. The browser gate on the same origin (UI01-PROV-003) follows the
      # smokes below (Phase UI-16).
      # ---------------------------------------------------------------------------
      # The PROD php target is used deliberately: it is self-contained (`COPY . /var/www/html`),
      # whereas the dev target expects a bind-mounted source and would serve nothing here.
      - name: Build app image (prod target) for the host smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php.Dockerfile
          target: prod
          push: false
          load: true
          tags: servana-app:ci-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start the built images
        run: |
          docker network create servana-ci
          # Phase UI-17: a throwaway PostgreSQL 16 (CI-only credentials, never a real secret) so the
          # browser routes that read the database — the context-handoff consumer probed by the UI-17
          # edge smoke — behave as in a real environment instead of 500ing.
          docker run -d --name pg --network servana-ci \
            -e POSTGRES_DB=servana -e POSTGRES_USER=servana -e POSTGRES_PASSWORD=servana \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U servana -d servana >/dev/null 2>&1; then echo "postgres ready"; break; fi
            sleep 2
          done
          # The upstream MUST be named `app` — docker/nginx/default.conf does `fastcgi_pass app:9000`.
          # Session/cache stay array-backed; only the database is real.
          docker run -d --name app --network servana-ci \
            -e SESSION_DRIVER=array -e CACHE_STORE=array -e QUEUE_CONNECTION=sync \
            -e DB_CONNECTION=pgsql -e DB_HOST=pg -e DB_PORT=5432 -e DB_DATABASE=servana \
            -e DB_USERNAME=servana -e DB_PASSWORD=servana \
            servana-app:ci-prod
          docker run -d --name edge --network servana-ci -p 8080:8080 servana-nginx:ci
          for i in $(seq 1 40); do
            if curl -fsS -H 'Host: localhost' http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "edge ready"; break
            fi
            sleep 2
          done
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8080/health
          docker exec app php artisan migrate --force --no-interaction

      - name: Extract the built SPA manifest for the smoke matrix
        run: |
          mkdir -p public/spa/.vite
          docker cp edge:/var/www/html/public/spa/.vite/manifest.json public/spa/.vite/manifest.json

      - name: Smoke — eight account hosts on the built image (Phase UI-02)
        run: node scripts/ui02-host-smoke.mjs --origin http://127.0.0.1:8080

      # Phase UI-05: the offline contracts prove the curated assets exist and hash correctly; this
      # proves the EDGE serves them with the right MIME and withholds the eleven quarantined brand
      # working files and the deleted vector logo.
      - name: Smoke — UI-05 content and asset pipeline on the built image
        run: node scripts/ui05-production-smoke.mjs http://127.0.0.1:8080 servana.test

      # Phase UI-06: the Playwright suite runs against a Vite preview origin with no Laravel behind
      # it, so the account context it exercises is installed by the harness (UI01-PROV-003; the UI-16
      # browser gate below covers the served origin). This closes the other half: the eight public surfaces probed over HTTP with genuine
      # account Host headers, so the context is resolved by the SERVER exactly as in production.
      - name: Smoke — UI-06 public surfaces on the built image
        run: node scripts/ui06-public-host-smoke.mjs --origin http://127.0.0.1:8080

      # Phase UI-16 (closes UI01-PROV-003): the release BROWSER gate on the built production origin.
      # A real Chromium resolves every canonical account host to this edge, so the served shell,
      # entry assets, server-resolved account context and anonymous sign-in redirect are exactly
      # what production serves — not the Vite preview the main Playwright suite uses.
      - name: Install Playwright Chromium for the production-origin gate
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser gate — eight account hosts on the built production origin (UI-16)
        env:
          SERVANA_ORIGIN: 127.0.0.1:8080
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/production-origin.xml
        run: npx playwright test -c playwright.origin.config.ts --reporter=list,junit

      # Phase UI-17: the eight-host edge security matrix on the built pair — reviewed CSP present once,
      # framing/nosniff/Permissions-Policy, gzip on fingerprinted chunks, no source maps or private
      # manifests, no CORS approval for a foreign origin, no stack trace in an error envelope, a
      # forged X-Forwarded-Host changes nothing, the handoff consumer keeps exactly `no-referrer`,
      # and unknown hosts are refused. Then the edge access log must not contain the synthetic
      # credential the smoke sent (UI17-SEC-001).
      - name: Smoke — UI-17 edge security matrix on the built image
        run: node scripts/ui17-edge-smoke.mjs --origin http://127.0.0.1:8080 --out test-results/ui17-edge-smoke.json

      - name: Security — the edge access log holds no credential (UI-17)
        run: |
          if docker logs edge 2>&1 | grep -q 'UI17SYNTHETICCANARY'; then
            echo "::error::the edge access log recorded the synthetic credential sent by the UI-17 smoke"
            exit 1
          fi
          docker logs edge 2>&1 | grep -c '"path":"/auth/switch"'

      - name: Upload production-origin browser results (UI-16, UI-17)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui16-production-origin
          path: test-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload host matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-host-matrix
          path: docs/frontend/audits/ui-02/host-matrix.json
          if-no-files-found: warn

      - name: Tear down smoke containers
        if: always()
        run: |
          docker rm -f edge app pg || true
          docker network rm servana-ci || true

  security:
    name: Security — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    # Authoritative Linux browser gate for Phase 10. The local Windows Playwright
    # run stalled without producing a completed run, so the SPA end-to-end suite
    # MUST be exercised here on Linux. Kept separate from Backend/Frontend/Docker/
    # Security; the SPA is a static preview build, so no Postgres/Redis is needed.
    name: E2E — Playwright
    runs-on: ubuntu-latest
    # Stall bound, not a performance budget: fails the workflow if the run hangs
    # without completing (the documented Windows-host failure mode) rather than
    # hanging indefinitely. It must stay comfortably ABOVE the honest runtime, or
    # it silently truncates a passing suite.
    #
    # Raised 20 -> 60 in Phase UI-06. The suite is serial by contract
    # (playwright.config.ts pins workers=1, retries=1 on CI) and has grown to 1,024
    # tests, which docs/proof/ui-06.md records at 32.6 min locally; two UI-01 sweeps
    # alone carry a 15-minute per-test budget each. Run 30917088915 was cancelled at
    # exactly 20m15s with 870/870 completed tests PASSING and none failed — the job
    # was killed mid-test, it did not fail. No test, assertion, retry or reporter
    # setting is relaxed here; every test still runs and still has to pass.
    # UI-16 adds 307 responsive/axe/theme cases and 54 visual comparisons. The frozen
    # Windows full run took 78 minutes; preserve a bounded allowance for the larger suite.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser + Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Build SPA — Vite (production)
        run: npm run build

      - name: UI-16 additional archetype visual comparisons
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: /tmp/ui16-archetypes.xml
        run: npx playwright test tests/e2e/ui-16-archetype-visual-regression.spec.ts --update-snapshots=none --reporter=list,junit

      - name: End-to-end tests — Playwright (Chromium)
        # `npm run e2e` exits non-zero on any failed Playwright test, failing the
        # workflow. Existing tests are run unmodified — no skip, no extra retry,
        # no suppression (playwright.config.ts already pins CI retries=1, workers=1).
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/e2e.xml
        run: npm run e2e -- --update-snapshots=none --reporter=list,junit,html

      - name: Upload Playwright report + test results (UI-16 acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            /tmp/ui16-archetypes.xml
            playwright-report/
            test-results/
            tests/e2e/ui-16-visual-regression.spec.ts-snapshots/
            tests/e2e/ui-16-archetype-visual-regression.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 14
