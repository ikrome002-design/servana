  - id: REM-TEN-001
    classification: C0
    gating_category: PRE_FEATURE_REMEDIATION
    scope_requirement: "Add merchant_id to branch-owned tables where missing; backfill; indexes/constraints; static-analysis/source-scan; route-binding tenant safety (Plan §79 R5; ADR-002; Correction 7)."
    repository_evidence: >
      BEFORE (proven via information_schema): branch_user_assignments,
      branch_operating_hours, branch_calendar_exceptions, branch_day_records,
      branch_cash_ups carry branch_id but NOT merchant_id; staff_history and
      merchant_user_permission_overrides (tenant-owned) also lacked merchant_id.
      Models BranchOperatingHour/CalendarException/DayRecord/CashUp used
      BelongsToBranch but not BelongsToMerchant; BranchUserAssignment used neither.
      DONE (R5): central registry app/Domain/Tenancy/TenantOwnership.php classifies
      every existing table (branch_owned / tenant_owned / exempt-with-reason).
      Three forward-only migrations (2026_06_23_000001/2/3): parent UNIQUE(id,
      merchant_id) on merchant_branches/staff_profiles/merchant_users; expand→
      backfill(parameterized cursor, fail-safe)→NOT NULL→index→FKs on the 5 branch
      tables; same for staff_history + merchant_user_permission_overrides. DB
      consistency via composite FK (fk, merchant_id)→parent(id, merchant_id) +
      merchant_id→merchants RESTRICT; index beginning with merchant_id. Models gain
      BelongsToMerchant (+BelongsToBranch for the 4 branch models); BranchUserAssignment
      is BranchScope-exempt (it resolves TenantContext::branchIds; BranchScope would
      be circular) — documented in the registry. Creation sites set merchant_id from
      the branch/parent (AcceptStaffInvitation runs without context → explicit).
      Coverage: TenantColumnCoverageTest (live schema), ModelTenancyTraitCoverageTest,
      RouteBindingTenantSafetyTest + retained TenancyStaticAnalysisTest. 404
      cross-tenant / 403 cross-branch contract unchanged.
    root_cause: "Phase 9 derived merchant isolation for branch-owned tables via a branch→merchant subquery instead of a direct merchant_id column; no DB guarantee that a row's merchant matches its branch, and a future route-bound branch table could resolve a ULID outside merchant scope."
    affected_files_tables_routes: >
      TABLES: branch_user_assignments, branch_operating_hours, branch_calendar_exceptions,
      branch_day_records, branch_cash_ups (+merchant_id, composite FK); staff_history,
      merchant_user_permission_overrides (+merchant_id, composite FK); merchant_branches,
      staff_profiles, merchant_users (+UNIQUE(id,merchant_id)). NEW:
      app/Domain/Tenancy/TenantOwnership.php; migrations 2026_06_23_000001/2/3;
      docs/architecture/data-dictionary/branches-and-staff.md; ADR-002; tests
      (TenantColumnCoverage, TenantBackfillMigration, TenantBranchConsistencyConstraint,
      ModelTenancyTraitCoverage, CrossTenantBranchOwnedModel, RouteBindingTenantSafety).
      CHANGED MODELS: BranchUserAssignment, BranchOperatingHour, BranchCalendarException,
      BranchDayRecord, BranchCashUp, StaffHistory, MerchantUserPermissionOverride.
      CHANGED CREATION SITES: AcceptStaffInvitation, StaffLifecycleService, OpenBranchDay,
      CloseBranchDay, BranchOperatingHoursController, PermissionOverrideService; 3 factories.
    security_data_business_impact: "Every branch-owned record is now structurally protected by merchant_id + branch_id with a DB composite FK that rejects a merchant/branch mismatch; tenant-owned history/override tables carry merchant_id; route-bound owned models resolve only within merchant scope. Defense in depth beyond the prior subquery isolation."
    precise_correction: "Smallest correct expand-and-contract hardening of EXISTING tables only. No new business tables/routes; no R6 revocation; cash-up behaviour (18B) untouched beyond ownership columns."
    migration_impact: "expand-and-contract, forward-only: +merchant_id on 7 tables (backfilled, NOT NULL, indexed, composite-FK consistency); +UNIQUE(id,merchant_id) on 3 parents. No shipped migration edited; backfill fails safely on orphans."
    test_plan: >
