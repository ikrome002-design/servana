      app/Domain/Tenancy/TenantOwnership.php; migrations 2026_06_23_000001/2/3;
      docs/architecture/data-dictionary/branches-and-staff.md; ADR-002; tests
      (TenantColumnCoverage, TenantBackfillMigration, TenantBranchConsistencyConstraint,
