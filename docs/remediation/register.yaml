  - id: REM-IDEMP-001
    classification: C0
    gating_category: PRE_FEATURE_REMEDIATION
    scope_requirement: "Corrected idempotency_keys schema + middleware + financial-route coverage test + provider-callback dedupe seams (Plan §79 R4; ADR-003; Correction 3)."
    repository_evidence: >
      BEFORE (proven): no idempotency_keys table (\dt absent); no Idempotency-Key
      middleware/hasher; no encrypted response replay; no coverage test; no
      expired-lock recovery; no provider dedupe seam. Plan §4 finding 9: prior
      invalid schema (no key_hash) contradicted — table absent.
      DONE (R4): idempotency_keys per §13.5 (UNIQUE(idempotency_scope,key_hash);
      indexes (state,lock_expires_at) + (expires_at); state CHECK; key_hash
      char(64)=SHA-256(raw key); response_body_encrypted via `encrypted:array`;
      FKs actor SET NULL / merchant,branch RESTRICT). EnsureIdempotentRequest
      implements §24.4: require Idempotency-Key 16-255; deterministic scope
      (IdempotencyScopeResolver: merchant:{ulid}:user:{ulid} | platform:user:{ulid}
      | webhook:{provider}:{env}); canonical request hash (CanonicalRequestHasher:
      method+route+normalized path params+content type+recursively key-sorted body;
      JSON key order irrelevant). Concurrency boundary is PostgreSQL: first claim
      INSERT ON CONFLICT DO NOTHING (insertOrIgnore), existing-row resolution under
      SELECT FOR UPDATE. completed→replay; different request→409
      idempotency_key_reused_with_different_request; processing+active→409
      request_in_progress+Retry-After; processing+expired or failed→reclaim+retry.
      Stable 4xx stored completed (replayed); 5xx/transient → failed (redacted code,
      retryable). ReplayResponseSanitizer allowlists content-type only; never
      cookies/auth/xsrf/session/CSP/signed-URL/server/debug; replay tagged
      Idempotent-Replay:true; body encrypted at rest. idempotency:prune (bounded;
      never deletes active locks; standard ≥72h, retriable ≥30d) scheduled daily.
      ProviderReplayGuard generic dedupe seam (no M-Pesa). RouteClass +
      RouteClassification seam; FinancialRouteIdempotencyCoverageTest detects an
      unprotected financial route and passes once corrected.
    root_cause: "Idempotency store not yet built; the prior invalid definition (no key_hash, unique on (merchant_id,key_hash)) never existed in repo. Without it, financial mutations could double-apply on retry/duplicate/concurrent submission or provider redelivery."
    affected_files_tables_routes: >
      NEW table: idempotency_keys (migration 2026_06_22_000003). NEW:
      app/Domain/Idempotency/{ClaimResult,ClaimOutcome,IdempotencyStore,
      ProviderClaimResult,ProviderReplayGuard}.php, Enums/IdempotencyState.php,
      Models/IdempotencyKey.php, Support/{CanonicalRequestHasher,
      IdempotencyScopeResolver,ReplayResponseSanitizer}.php, Exceptions/*;
      app/Http/Middleware/EnsureIdempotentRequest.php;
      app/Http/Routing/{RouteClass,RouteClassification}.php;
      app/Console/Commands/PruneIdempotencyKeys.php;
      database/factories/IdempotencyKeyFactory.php; ADR-003; 10 test files.
      CHANGED: bootstrap/app.php (priority: EnsureIdempotentRequest last);
      routes/api.php (testing harness + financial classification);
      routes/console.php (prune schedule); config/servana.php; .env.example;
      docs/architecture/data-dictionary/*.
    security_data_business_impact: "Duplicate/concurrent/recoverable-retry requests produce exactly one durable effect; completed requests replay an encrypted, sanitised response. Only SHA-256(key) stored; body encrypted at rest; no cookies/tokens/session/unsafe headers stored or replayed; server failures store only a redacted code."
    precise_correction: "Built the corrected schema + reusable middleware + store + provider dedupe seam + classification seam only. No production financial/M-Pesa routes (truthfully empty); proven via a testing-only harness. Attachment to real routes is deferred to owning phases."
    migration_impact: "additive forward-only: idempotency_keys. No shipped migration edited; no backfill."
    test_plan: >
      DONE — tests/Feature/Idempotency/{IdempotencySchema,CanonicalRequestHash,
      IdempotentReplay,IdempotencyConflict,IdempotencyConcurrency,
      ExpiredLockRecovery,ReplayResponseSecurity,IdempotencyPrune,
      ProviderCallbackDedupeSeam}Test.php +
      tests/Feature/Security/FinancialRouteIdempotencyCoverageTest.php (41 tests).
      Full backend 351 passed / 4 skipped (serial + parallel); pint/stan L8/
      composer validate/composer audit/npm audit/gitleaks clean; vitest 77; e2e 30
      (after 1 documented auth flake rerun); both docker images build.
    proof_artifact: "docs/proof/phase-r4.md; docs/architecture/adr/0003-idempotency-and-replay-protection.md; docs/governance/solo-maintainer-review-exception-pr-16.md"
    owner: "R4"
    completion_commit: "1288f48 (PR #16)"
    rollback_forward_repair: "Forward-only; down() drops idempotency_keys. No backfill; rollback safe within the release. Disabling enforcement is route/config-level, never a destructive migration. Pruning is bounded + idempotent."
    reviewer: "Solo-maintainer governance exception (PR #16; reviewDecision blank; CI Backend/Frontend/Security/Docker passed) — documented in docs/governance/solo-maintainer-review-exception-pr-16.md; NOT an independent approval."
