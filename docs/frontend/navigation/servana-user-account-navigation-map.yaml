# =============================================================================================
# SERVANA CANONICAL AUTHENTICATED NAVIGATION AND SCREEN CONTRACT — Phase UI-07
#
# This file is the SINGLE handwritten authority for the 160 authenticated pages required by
# UI/UX plan §7.1-§7.5 and enumerated by the binding human map at
# docs/frontend/navigation/servana-user-account-navigation-maps.md (§5.4.x - §12.4.x).
#
# Everything else is DERIVED from this file and checked in CI:
#
#   resources/spa/src/navigation/navigationRegistry.generated.ts   typed runtime registry
#   docs/frontend/screens/contract/{account}/{screen_key}.md       160 screen specifications
#   docs/frontend/audits/ui-07/*.json                              contract/parity matrices
#
#   Regenerate with:  node scripts/generate-ui07-navigation-contract.mjs
#   Verify with:      node scripts/generate-ui07-navigation-contract.mjs --check
#
# Parity with the human map is enforced by Ui07NavigationRegistryContractTest: the account,
# label, route_path and description of all 160 entries are compared against the map itself, so
# this file cannot silently drift from the authority it encodes.
#
# BINDING RULES
#
#   * `route_name` / `route_path` are the page's CONTRACT identity. They are reserved here so a
#     later owner phase cannot silently rename a page. `route_path` is HOST-RELATIVE: every
#     account is served on its own host (ADR-016), so `/dashboard` is a different page on each.
#   * `implementation_status` is evidence, not intent:
#       implemented          a real runtime route in THIS account's tree renders a real,
#                            non-placeholder component today.
#       planned              no such delivery exists. NO runtime route, NO navigation link.
#       disabled_by_gate     blocked by the named external gate. Shown disabled, naming the
#                            gate; never a live destination.
#       removed_by_authority absent from router, navigation and every live audit set.
#   * `runtime_route_name` is the ACTUAL Vue Router record delivering an implemented page. It is
#     null for every other status. Route paths differ from `route_path` because the current
#     router uses the account's path prefix (`/finance/invoices`) rather than the host-relative
#     contract path (`/invoices`); UI-01 recorded this as UI01-ROUTE-003 and each owning UI phase
#     reconciles path shape when it implements its account.
#   * `route_delivery` records HOW an implemented page is reached:
#       dedicated             its own runtime route
#       consolidated          shares a runtime route with other contract pages (UI01-NAV-001)
#       cross_account_utility a shared authenticated utility route outside any account tree
#   * Permissions are DISCOVERABILITY ONLY (ADR-017, Plan §9 rule 2). The backend policy,
#     EnsurePermission middleware and tenant/branch/own scopes remain the security boundary.
#     UI-07 creates NO permission key: every key listed here already exists in
#     docs/auth/permission-matrix.yaml. A page with no proven key carries an empty list rather
#     than a guess — its owner phase supplies the key when it implements the page.
#   * `forbidden_for` is an authority-boundary record, never the security boundary.
# =============================================================================================
version: 1
total_required_pages: 160
source_authority: docs/frontend/navigation/servana-user-account-navigation-maps.md
governing_plan_sections:
  - "UI/UX plan §7.1 machine-readable navigation map"
  - "UI/UX plan §7.2 allowed implementation statuses"
  - "UI/UX plan §7.3 screen specification files"
  - "UI/UX plan §7.4 screen inventory parity"
  - "UI/UX plan §7.5 exact authenticated page count"

# Pages EXCLUDED from the 160 by UI/UX plan §7.5. They remain real routes; they are simply not
# authenticated account pages and must never be counted toward an account total.
excluded_from_count:
  - public landing pages
  - login
  - registration
  - magic link request
  - magic link consume
  - legal pages
  - FAQ
  - generic error pages
  - invitation acceptance
  - shared support overlays
  - modal routes that are not defined as full pages

