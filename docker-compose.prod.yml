name: servana-prod

# Production topology (Plan §26.1). PostgreSQL, Redis and S3 are expected to be
# MANAGED services; only the app tier is defined here. All secrets come from the
# host environment / secret store and the (uncommitted) .env — never baked into
# images (Plan §26.2). Full deployment wiring lands in Phase 25.

x-app-prod-environment: &app-prod-environment
  APP_ENV: production
  APP_DEBUG: "false"
  # Bound libpq connect time so a dead PostgreSQL fails the readiness probe fast
  # instead of hanging (Plan §79 R7). Redis/S3/Meilisearch timeouts are bounded in
  # config (REDIS_TIMEOUT / AWS_CONNECT_TIMEOUT / servana.health.probe_timeout).
  PGCONNECT_TIMEOUT: "5"

services:
  app:
    image: ${APP_IMAGE:-servana-app:prod}
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: prod
    environment: *app-prod-environment
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-servana-nginx:prod}
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      target: prod
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:8080"
    # Traffic eligibility depends on the app's REQUIRED dependencies, so the
    # edge healthcheck uses READINESS (/health/deep → 503 when a required
    # dependency is down) — an orchestrator/LB then stops routing to this
    # instance. The app container below keeps a dependency-free liveness check.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/deep"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:-servana-app:prod}
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment: *app-prod-environment
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: ${APP_IMAGE:-servana-app:prod}
    command: ["php", "artisan", "schedule:work"]
    environment: *app-prod-environment
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
