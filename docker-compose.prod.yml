name: servana-prod

# Production topology (Plan §26.1). PostgreSQL, Redis and S3 are expected to be
# MANAGED services; only the app tier is defined here. All secrets come from the
# host environment / secret store and the (uncommitted) .env — never baked into
# images (Plan §26.2). Full deployment wiring lands in Phase 25.

x-app-prod-environment: &app-prod-environment
  APP_ENV: production
  APP_DEBUG: "false"

services:
  app:
    image: ${APP_IMAGE:-servana-app:prod}
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: prod
    environment: *app-prod-environment
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-servana-nginx:prod}
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      target: prod
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:-servana-app:prod}
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment: *app-prod-environment
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: ${APP_IMAGE:-servana-app:prod}
    command: ["php", "artisan", "schedule:work"]
    environment: *app-prod-environment
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
