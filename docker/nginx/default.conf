# Servana nginx server (Plan §4.1). Serves the Laravel public/ root, proxies PHP
# to the app (php-fpm) container, and serves the built Vue SPA from /spa.
# Listens on 8080 to run as the non-root nginx user (Plan §26.1 non-root).

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Security headers (a stricter CSP is finalized in Phase 23, Plan §24).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    # Liveness probe (Plan §22.1) handled by Laravel.
    location = /health {
        try_files $uri /index.php?$query_string;
    }

    # Built SPA bundle (Vite output).
    location /spa/ {
        alias /var/www/html/public/spa/;
        try_files $uri $uri/ =404;
    }

    # Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny dotfiles (e.g. .env, .git) outright.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
