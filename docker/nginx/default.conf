# Servana edge (Plan §4.1; Phase UI-02 — ADR-016, ADR-017; UI/UX plan §4.7).
#
# Serves the eight approved account hosts from ONE application. Listens on 8080 so the
# container runs as the non-root `nginx` user (Plan §26.1).
#
# Phase UI-02 closes four UI-01 defects here:
#   UI01-PROV-001  `/` served Laravel's stock scaffold  -> Laravel now renders the SPA shell
#   UI01-PROV-002  SPA chunks 404'd under /spa/         -> one prefix per owner, see below
#   UI01-HOST-001  `server_name _` accepted every host  -> generated allowlist + default deny
#   UI01-ASSET-005 brand assets unreachable             -> /assets/ served from Laravel public
#
# Path ownership is now unambiguous:
#   /spa-assets/*  fingerprinted Vite output   (public/spa/spa-assets)  immutable cache
#   /assets/*      Laravel public assets       (public/assets)          brand + landing images
#   /api, /health, /up, /sanctum, /storage     Laravel                  never SPA-fallback
#   everything else                            Laravel SPA shell        revalidated HTML

# Unknown hosts never reach the application. This catch-all is the DEFAULT server, so any
# Host that does not match the generated allowlist below lands here and the connection is
# closed without a response body. It discloses nothing — not even that Servana exists.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

# MACHINE / INTERNAL host (UI/UX plan §4.7). Container liveness probes and in-network
# service calls address the edge by its container or loopback name, which is NOT an
# account host. It is modelled separately here rather than being added to the account
# allowlist, because a machine host is not a ninth account and must never resolve to an
# account experience. Only the probe endpoints are exposed; every other path 404s, so this
# block cannot become an unauthenticated side door into the application.
server {
    listen 8080;
    server_name localhost 127.0.0.1 nginx servana-nginx;

    root /var/www/html/public;

    location = /health     { try_files $uri /index.php?$query_string; }
    location = /health/deep { try_files $uri /index.php?$query_string; }
    location = /health/host { try_files $uri /index.php?$query_string; }
    location = /up         { try_files $uri /index.php?$query_string; }

    location / {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }
}

server {
    listen 8080;

    # Generated from config/account-hosts.json — the single account-host authority.
    # Regenerate with: node scripts/generate-account-hosts.mjs
    #
    # It lives OUTSIDE conf.d/ on purpose: nginx.conf auto-includes conf.d/*.conf at the
    # http level, and this fragment is a bare `server_name` directive that is only valid
    # inside a server block.
    include /etc/nginx/servana/account-hosts.generated.conf;

    root /var/www/html/public;
    index index.php;

    # Security headers (a stricter CSP is finalized in Phase 23, Plan §24).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    # Correlation id: preserve the caller's when present, otherwise mint one from nginx's
    # per-request id so a request can be traced end to end (Plan §11.5, §22.1).
    set $correlation_id $http_x_correlation_id;
    if ($correlation_id = "") {
        set $correlation_id $request_id;
    }

    # ---------------------------------------------------------------------------
    # Backend-owned paths. `^~` stops regex locations from being considered, so the
    # SPA fallback below can never swallow an API, health, file or webhook route.
    # ---------------------------------------------------------------------------
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri /index.php?$query_string;
    }

    location = /health {
        try_files $uri /index.php?$query_string;
    }

    location = /health/deep {
        try_files $uri /index.php?$query_string;
    }

    location = /health/host {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------------

    # Fingerprinted Vite output. The filename carries the content hash, so it is safe to
    # cache immutably; a deployment changes the name, never the contents of a name.
    location ^~ /spa-assets/ {
        alias /var/www/html/public/spa/spa-assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Laravel's own public assets: approved brand files (Logo.png, the six lowercase
    # favicons) and the supplied landing images. Not fingerprinted, so cached for a day
    # and revalidated rather than pinned forever.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # /spa/ compatibility. The SPA used to be mounted here and its chunks 404'd
    # (UI01-PROV-002). It is not a product route: it permanently redirects to the account
    # root so no second application origin exists and no bookmark silently breaks.
    location ^~ /spa/ {
        return 301 /;
    }

    location = /spa {
        return 301 /;
    }

    # ---------------------------------------------------------------------------
    # Application
    # ---------------------------------------------------------------------------

    # Browser routes render the SPA shell through Laravel, which resolves the account host
    # and injects the account context. The shell names fingerprinted chunks, so it must be
    # revalidated rather than cached immutably.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Preserve the ORIGINAL host and scheme so Laravel resolves the account host the
        # browser actually used, not the upstream's own name (UI/UX plan §4.7).
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_CORRELATION_ID $correlation_id;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny dotfiles (e.g. .env, .git) outright.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
