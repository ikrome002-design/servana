# Servana edge (Plan §4.1; Phase UI-02 — ADR-016, ADR-017; UI/UX plan §4.7).
#
# Serves the eight approved account hosts from ONE application. Listens on 8080 so the
# container runs as the non-root `nginx` user (Plan §26.1).
#
# Phase UI-02 closes four UI-01 defects here:
#   UI01-PROV-001  `/` served Laravel's stock scaffold  -> Laravel now renders the SPA shell
#   UI01-PROV-002  SPA chunks 404'd under /spa/         -> one prefix per owner, see below
#   UI01-HOST-001  `server_name _` accepted every host  -> generated allowlist + default deny
#   UI01-ASSET-005 brand assets unreachable             -> /assets/ served from Laravel public
#
# Path ownership is now unambiguous:
#   /spa-assets/*  fingerprinted Vite output   (public/spa/spa-assets)  immutable cache
#   /assets/*      Laravel public assets       (public/assets)          brand + landing images
#   /api, /health, /up, /sanctum, /storage     Laravel                  never SPA-fallback
#   everything else                            Laravel SPA shell        revalidated HTML

# ---------------------------------------------------------------------------------------------
# Phase UI-17 — http-level edge policy (UI/UX plan §4.7, §18.6, §18.7, §22.1). This file is
# included at the http level by nginx.conf, so the `log_format` and `map` blocks below are valid
# here and apply to the three server blocks that follow.
# ---------------------------------------------------------------------------------------------

# UI17-SEC-001 — the stock `main` log format records "$request" (path AND query string) and
# "$http_referer". Magic Links (`/auth/verify?token=…`) and context handoffs (`/auth/switch?token=…`)
# carry their one-time credential in the query string, so every sign-in wrote a raw token into the
# edge access log (Plan §24.5, UI/UX plan §18.7, CLAUDE.md §6.4). This format logs the PATH ONLY —
# captured from the original request URI, never its query string — and no referer, as structured
# JSON with the correlation id (Plan §71).
map $request_uri $servana_log_path {
    "~^(?<servana_path>[^?]*)" $servana_path;
    default "-";
}

log_format servana_edge escape=json
    '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"path":"$servana_log_path","protocol":"$server_protocol","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","user_agent":"$http_user_agent"}';

# UI17-SEC-002 — `add_header` APPENDS to upstream headers. The context-handoff consumer answers
# with `Referrer-Policy: no-referrer` so its token cannot ride a Referer header; the edge then
# appended `strict-origin-when-cross-origin`, and a browser resolving the combined header takes the
# LAST valid token — the weaker one. The edge default now applies only when the application has
# not chosen a policy itself (an empty value suppresses the header).
map $upstream_http_referrer_policy $servana_referrer_policy {
    "" "strict-origin-when-cross-origin";
    default "";
}

# UI17-PERF-001 — the base image ships with `gzip` commented out, so every fingerprinted chunk
# crossed the wire uncompressed (the 120,731-byte entry chunk was served as 120,731 bytes). Text
# assets are now compressed; the level matches the reviewed budget method in
# config/frontend-performance-budget.json. `gzip on` is set ONLY inside the two static-asset
# locations below: nginx always compresses text/html once gzip is on, and HTML and API JSON are
# deliberately left alone — tiny, or carrying reflected user-specific data (the BREACH precondition).
gzip_comp_level 6;
gzip_min_length 1024;
# UI17-PERF-006: nginx's own `proxy_pass` speaks HTTP/1.0 to its upstream by default, and with the
# stock `gzip_http_version 1.1` this edge then silently stopped compressing — the release rehearsal
# found every chunk uncompressed behind a front nginx. Compress whatever HTTP version the hop in front
# of this edge uses, so the guarantee does not depend on how Phase 25 configures its load balancer.
gzip_http_version 1.0;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript image/svg+xml application/manifest+json;

# HSTS (UI/UX plan §4.6, §18.6). Sent only on a response the browser receives over HTTPS — either
# TLS terminated here or reported by the TLS terminator — because a browser ignores STS received
# over plain HTTP anyway. The value is STAGED at `max-age=0` until production DNS and TLS are
# validated for all eight hosts; raising it (then adding includeSubDomains; preload is a separate,
# explicit decision) is a reviewed one-line change in a new immutable image, never an env toggle.
map "$scheme:$http_x_forwarded_proto" $servana_hsts {
    "~^https:" "max-age=0";
    "~:https$" "max-age=0";
    default "";
}

# Unknown hosts never reach the application. This catch-all is the DEFAULT server, so any
# Host that does not match the generated allowlist below lands here and the connection is
# closed without a response body. It discloses nothing — not even that Servana exists.
server {
    listen 8080 default_server;
    server_name _;
    access_log /var/log/nginx/access.log servana_edge;
    return 444;
}

# MACHINE / INTERNAL host (UI/UX plan §4.7). Container liveness probes and in-network
# service calls address the edge by its container or loopback name, which is NOT an
# account host. It is modelled separately here rather than being added to the account
# allowlist, because a machine host is not a ninth account and must never resolve to an
# account experience. Only the probe endpoints are exposed; every other path 404s, so this
# block cannot become an unauthenticated side door into the application.
server {
    listen 8080;
    server_name localhost 127.0.0.1 nginx servana-nginx;
    access_log /var/log/nginx/access.log servana_edge;

    root /var/www/html/public;

    location = /health     { try_files $uri /index.php?$query_string; }
    location = /health/deep { try_files $uri /index.php?$query_string; }
    location = /health/host { try_files $uri /index.php?$query_string; }
    location = /up         { try_files $uri /index.php?$query_string; }

    location / {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }
}

server {
    listen 8080;

    # Generated from config/account-hosts.json — the single account-host authority.
    # Regenerate with: node scripts/generate-account-hosts.mjs
    #
    # It lives OUTSIDE conf.d/ on purpose: nginx.conf auto-includes conf.d/*.conf at the
    # http level, and this fragment is a bare `server_name` directive that is only valid
    # inside a server block.
    include /etc/nginx/servana/account-hosts.generated.conf;

    root /var/www/html/public;
    index index.php;
    access_log /var/log/nginx/access.log servana_edge;

    # Security headers (UI/UX plan §18.6; Phase UI-17).
    #
    # Content-Security-Policy — the SPA loads only same-origin, fingerprinted code. The single
    # inline script is the fixed theme bootstrap kept byte-identical in resources/views/spa.blade.php
    # and resources/spa/index.html; it is allowed by its SHA-256 hash, never by 'unsafe-inline', and
    # `node scripts/ui17-edge-security-contract.mjs` fails when the script and this hash drift apart.
    # The embedded account context is a `type="application/json"` data block and never executes.
    # Vue's style bindings write through the CSSOM, which `style-src` does not govern, so no
    # 'unsafe-inline' style allowance is needed. `blob:` images are the Merchant Profile logo-upload
    # preview (an object URL of the file being chosen); nothing is ever loaded from `data:` — Vite is
    # told never to inline font files (vite.config.ts), so `font-src` stays 'self' only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-iXHip2mgvPlld5zyfxveb26d7cVOx/dPvQ6deyJcvpk='; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy $servana_referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Strict-Transport-Security $servana_hsts always;

    client_max_body_size 25m;

    # Correlation id: preserve the caller's when present, otherwise mint one from nginx's
    # per-request id so a request can be traced end to end (Plan §11.5, §22.1).
    set $correlation_id $http_x_correlation_id;
    if ($correlation_id = "") {
        set $correlation_id $request_id;
    }

    # ---------------------------------------------------------------------------
    # Backend-owned paths. `^~` stops regex locations from being considered, so the
    # SPA fallback below can never swallow an API, health, file or webhook route.
    # ---------------------------------------------------------------------------
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri /index.php?$query_string;
    }

    location = /health {
        try_files $uri /index.php?$query_string;
    }

    location = /health/deep {
        try_files $uri /index.php?$query_string;
    }

    location = /health/host {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------------

    # Fingerprinted Vite output. The filename carries the content hash, so it is safe to
    # cache immutably; a deployment changes the name, never the contents of a name.
    location ^~ /spa-assets/ {
        alias /var/www/html/public/spa/spa-assets/;
        access_log off;
        gzip on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Laravel's own public assets: approved brand files (Logo.png, the six lowercase
    # favicons) and the supplied landing images. Not fingerprinted, so cached for a day
    # and revalidated rather than pinned forever.
    location ^~ /assets/ {
        access_log off;
        gzip on;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # nginx 1.27's stock mime.types has no `.webmanifest` entry, so the web app manifest would
    # be served as application/octet-stream — and because `nosniff` is set, the browser refuses
    # to parse it rather than guessing, and the manifest silently does nothing.
    #
    # This is an EXACT-MATCH location rather than a `types { }` block inside `/assets/`: an
    # inner `types` block REPLACES the inherited mime map for that location wholesale, which
    # cost the brand PNGs their `image/png` type and served them as octet-stream. Overriding
    # one file's type in its own location leaves every other asset's type intact
    # (Phase UI-04, UI01-ASSET-003).
    location = /assets/brand/site.webmanifest {
        access_log off;
        gzip on;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # /spa/ compatibility. The SPA used to be mounted here and its chunks 404'd
    # (UI01-PROV-002). It is not a product route: it permanently redirects to the account
    # root so no second application origin exists and no bookmark silently breaks.
    location ^~ /spa/ {
        return 301 /;
    }

    location = /spa {
        return 301 /;
    }

    # ---------------------------------------------------------------------------
    # Application
    # ---------------------------------------------------------------------------

    # Browser routes render the SPA shell through Laravel, which resolves the account host
    # and injects the account context. The shell names fingerprinted chunks, so it must be
    # revalidated rather than cached immutably.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Preserve the ORIGINAL host and scheme so Laravel resolves the account host the
        # browser actually used, not the upstream's own name (UI/UX plan §4.7).
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_CORRELATION_ID $correlation_id;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny dotfiles (e.g. .env, .git) outright.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
