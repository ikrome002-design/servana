; OPcache (Plan §26.1: opcache on; preload in prod). `validate_timestamps` is
; driven by PHP_OPCACHE_VALIDATE_TIMESTAMPS (1 in dev for live edits, 0 in prod).
;
; Phase 24 (PH24-OPCACHE-001): `opcache.preload` is driven by PHP_OPCACHE_PRELOAD, which the `prod`
; stage points at docker/php/preload.php and the `dev` stage leaves EMPTY. An empty value disables
; preloading, so dev keeps live-edit behaviour while production compiles the application and
; framework class files at pool start. `opcache.preload_user` is deliberately NOT set: PHP only
; requires it when the FPM master runs as root, and both stages drop to the non-root `servana` user
; before starting php-fpm. Setting it to a user that is not the running user is itself an error.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
opcache.preload = ${PHP_OPCACHE_PRELOAD}
