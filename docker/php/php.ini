; Servana PHP runtime tuning (applied on top of php.ini-production defaults).
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 27M
max_execution_time = 60
expose_php = Off

; UTC at the engine level; business-day logic uses Africa/Nairobi in app code
; (Plan AS-3).
date.timezone = UTC

; Surface errors to the container log in all environments; APP_DEBUG controls
; what reaches the client.
log_errors = On
error_log = /dev/stderr
